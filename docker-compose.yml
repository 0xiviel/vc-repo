version: '3.8'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vc-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///app/test.db
    volumes:
      - backend_data:/app
    networks:
      - app_network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vc-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app_network
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: vc-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      - backend
      - frontend
    networks:
      - app_network
networks:
  app_network:
    driver: bridge
volumes:
  backend_data: